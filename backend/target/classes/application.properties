spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/campusbite
spring.datasource.username=postgres
spring.datasource.password=arnav365
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# Initialize data.sql after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration
# IMPORTANT: Change this secret to a long random string in production (min 32 chars)
app.jwt.secret=campusbite-super-secret-jwt-key-change-this-in-production-environment
app.jwt.expiration-ms=86400000

# Google Gemini API Key
# Get your key from: https://aistudio.google.com/app/apikey
app.gemini.api-key=YOUR_GEMINI_API_KEY_HERE

# Logging
logging.level.com.campusbite=INFO
logging.level.org.springframework.security=WARN