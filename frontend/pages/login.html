<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusBite – Login</title>
  <link rel="stylesheet" href="../styles/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="auth-container">
    <div class="brand">
      <div class="brand-icon">🍔</div>
      <h1 class="brand-name">CampusBite</h1>
      <p class="brand-tagline">AI-powered food for college life</p>
    </div>

    <div class="card">
      <h2 class="card-title">Welcome Back</h2>
      <p class="card-sub">Sign in to discover your next meal</p>

      <div id="error-msg" class="error-msg hidden"></div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your_username" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-primary" id="login-btn" onclick="handleLogin()">
        <span class="btn-text">Sign In</span>
        <span class="btn-loader hidden"></span>
      </button>

      <p class="redirect-text">
        Don't have an account?
        <a href="register.html" class="link">Create one</a>
      </p>
    </div>
  </div>

  <script src="../scripts/login.js"></script>
</body>
</html>
